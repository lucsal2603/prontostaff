<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProntoStaff+ · Logo animato</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/icona.png" type="image/png">
<style>
  @font-face { font-family: "Inter Tight"; src: url("assets/fonts/inter-tight-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; height: 100%; background: #0b0b0a; color: #f2ede3; font-family: "Inter Tight", system-ui, sans-serif; }
  body { display: grid; place-items: center; overflow: hidden; }
  .logo-scena { width: min(86vw, 1000px); height: auto; overflow: visible; }
  button {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%);
    height: 48px; padding: 0 26px; border-radius: 999px; border: 1px solid rgba(242,237,227,.18);
    background: none; color: inherit; font: inherit; font-size: 15px; cursor: pointer;
    transition: background-color .3s, color .3s;
  }
  button:hover { background: #e9b83c; color: #0b0b0a; border-color: #e9b83c; }
</style>
</head>
<body>
{{SCENA}}
<button type="button">Rivedi</button>
<script src="assets/js/gsap.min.js"></script>
<script src="assets/js/MorphSVGPlugin.min.js"></script>
<script src="assets/js/logo-animato.js"></script>
<script>
  gsap.registerPlugin(MorphSVGPlugin);
  var svg = document.querySelector('.logo-scena');
  var tl = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? (logoFermo(svg), null) : animaLogo(svg);
  document.querySelector('button').addEventListener('click', function () { if (tl) tl.restart(); });
</script>
</body>
</html>
