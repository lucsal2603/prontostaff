<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b0b0a">
<title>ProntoStaff+ · Gestionale</title>
<link rel="icon" href="../assets/img/icona.png" type="image/png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="piu" viewBox="0 0 20 20"><path d="M8.9 1.5h2.2v7.4h7.4v2.2h-7.4v7.4H8.9v-7.4H1.5V8.9h7.4z" fill="currentColor"/></symbol>
</svg>

<main class="schermo schermo--accesso" id="accesso" hidden>
  <form class="scheda" id="modulo-accesso" autocomplete="on">
    <div class="marchio"><svg class="marchio__piu"><use href="#piu"/></svg><span>Pronto<b>Staff+</b></span></div>
    <h1>Gestionale</h1>
    <p class="nota">Accesso riservato.</p>
    <label class="campo"><span>Utente</span><input name="utente" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label class="campo"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
    <button class="pulsante" type="submit">Entra</button>
    <p class="esito" role="alert"></p>
  </form>
</main>

<div class="app" id="app" hidden>
  <header class="testata">
    <div class="marchio"><svg class="marchio__piu"><use href="#piu"/></svg><span>Pronto<b>Staff+</b></span><em>Gestionale</em></div>
    <div class="testata__azioni">
      <button class="pulsante pulsante--vuoto pulsante--piccolo guida-tasto" type="button" id="apri-guida" aria-label="Guida"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M7.6 7.7a2.5 2.5 0 0 1 4.9.6c0 1.7-2.5 2-2.5 3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="14.4" r="0.95" fill="currentColor"/></svg><span>Guida</span></button>
      <a class="pulsante pulsante--vuoto pulsante--piccolo" href="../" target="_blank" rel="noopener">Apri il sito</a>
      <button class="pulsante pulsante--vuoto pulsante--piccolo" type="button" id="esci">Esci</button>
    </div>
  </header>
  <nav class="menu" id="menu" aria-label="Sezioni"></nav>
  <section class="contenuto" id="contenuto" aria-live="polite"></section>
  <footer class="barra" id="barra">
    <span class="barra__stato" id="stato">Nessuna modifica</span>
    <div class="barra__azioni">
      <button class="pulsante pulsante--vuoto" type="button" id="annulla" disabled>Annulla</button>
      <button class="pulsante pulsante--vuoto" type="button" id="anteprima" disabled>Anteprima</button>
      <button class="pulsante" type="button" id="pubblica" disabled>Pubblica</button>
    </div>
  </footer>
</div>

<div class="avviso" id="avviso" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
